services:
  # =============================================================================
  # VPN CLIENT SERVICE - Your VPN Connection Provider
  # =============================================================================
  vpn-client:
    image: qmcgaw/gluetun:v3.41.3
    container_name: vpn-client
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ../../vpn-client:/gluetun
    environment:
      - UPDATER_PERIOD=${UPDATER_PERIOD:-24h}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - OPENVPN_USER=${VPN_USER}
      - OPENVPN_PASSWORD=${VPN_PASSWORD}
      - FIREWALL_OUTBOUND_SUBNETS=${VPN_SENTINEL_DOCKER_SUBNET:-198.18.0.0/24}
    networks:
      - vpn-sentinel
    restart: always

  # =============================================================================
  # VPN SENTINEL CLIENT - Monitors from inside VPN network
  # =============================================================================
  vpn-sentinel-client:
    image: agigante80/vpn-sentinel-client:latest
    container_name: vpn-sentinel-client
    volumes:
      - ./certs:/certs:ro
    environment:
      - VPN_SENTINEL_URL=http://${VPN_SENTINEL_SERVER_IP:-198.18.0.10}:${VPN_SENTINEL_SERVER_API_PORT:-5000}
      - VPN_SENTINEL_API_PATH=/api/v1
      - VPN_SENTINEL_CLIENT_ID=${VPN_SENTINEL_CLIENT_ID:-vpn-monitor-main}
      - VPN_SENTINEL_API_KEY=${VPN_SENTINEL_API_KEY}
      # A *_FILE value is a path INSIDE the container: mount the file too (see deployments/README.md).
      - VPN_SENTINEL_API_KEY_FILE=${VPN_SENTINEL_API_KEY_FILE:-}
      - TZ=${TZ:-UTC}
      - VPN_SENTINEL_TLS_CERT_PATH=${VPN_SENTINEL_TLS_CERT_PATH:-}
      - VPN_SENTINEL_DEBUG=${VPN_SENTINEL_DEBUG}
      - VPN_SENTINEL_GEOLOCATION_SERVICE=${VPN_SENTINEL_GEOLOCATION_SERVICE:-auto}
      - VPN_SENTINEL_HEALTH_MONITOR=${VPN_SENTINEL_HEALTH_MONITOR:-false}
      - VPN_SENTINEL_HEALTH_PORT=${VPN_SENTINEL_HEALTH_PORT:-8082}
    network_mode: service:vpn-client
    restart: always
    depends_on:
      - vpn-client
      - vpn-sentinel-server

  # =============================================================================
  # VPN SENTINEL SERVER - Central monitoring server
  # =============================================================================
  vpn-sentinel-server:
    image: agigante80/vpn-sentinel-server:latest
    container_name: vpn-sentinel-server
    volumes:
      - ./certs:/certs:ro
    ports:
      - "5000:${VPN_SENTINEL_SERVER_API_PORT:-5000}"
      - "8080:8080"
    environment:
      - VPN_SENTINEL_SERVER_API_PORT=${VPN_SENTINEL_SERVER_API_PORT:-5000}
      - VPN_SENTINEL_SERVER_DASHBOARD_PORT=8080
      - VPN_SENTINEL_API_KEY=${VPN_SENTINEL_API_KEY}
      # A *_FILE value is a path INSIDE the container: mount the file too (see deployments/README.md).
      - VPN_SENTINEL_API_KEY_FILE=${VPN_SENTINEL_API_KEY_FILE:-}
      - TZ=${TZ:-UTC}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_TOKEN_FILE=${TELEGRAM_BOT_TOKEN_FILE:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_CHAT_ID_FILE=${TELEGRAM_CHAT_ID_FILE:-}
      - VPN_SENTINEL_APPRISE_URLS=${VPN_SENTINEL_APPRISE_URLS:-}
      - VPN_SENTINEL_APPRISE_URLS_FILE=${VPN_SENTINEL_APPRISE_URLS_FILE:-}
      - VPN_SENTINEL_METRICS_TOKEN=${VPN_SENTINEL_METRICS_TOKEN:-}
      - VPN_SENTINEL_METRICS_TOKEN_FILE=${VPN_SENTINEL_METRICS_TOKEN_FILE:-}
      - VPN_SENTINEL_TLS_CERT_PATH=${VPN_SENTINEL_TLS_CERT_PATH:-}
      - VPN_SENTINEL_TLS_KEY_PATH=${VPN_SENTINEL_TLS_KEY_PATH:-}
      - VPN_SENTINEL_SERVER_ALLOWED_IPS=${VPN_SENTINEL_SERVER_ALLOWED_IPS}
      - VPN_SENTINEL_SERVER_RATE_LIMIT_REQUESTS=${VPN_SENTINEL_SERVER_RATE_LIMIT_REQUESTS:-30}
      - VPN_SENTINEL_API_PATH=${VPN_SENTINEL_API_PATH:-/api/v1}
      - VPN_SENTINEL_SERVER_ALERT_THRESHOLD_MINUTES=${VPN_SENTINEL_SERVER_ALERT_THRESHOLD_MINUTES:-15}
      - VPN_SENTINEL_SERVER_CHECK_INTERVAL_MINUTES=${VPN_SENTINEL_SERVER_CHECK_INTERVAL_MINUTES:-5}
      - VPN_SENTINEL_SERVER_WEB_DASHBOARD_ENABLED=${VPN_SENTINEL_SERVER_WEB_DASHBOARD_ENABLED:-true}
    networks:
      vpn-sentinel:
        ipv4_address: ${VPN_SENTINEL_SERVER_IP:-198.18.0.10}
    restart: unless-stopped

networks:
  # Shared by gluetun and the server so the client (inside gluetun's namespace) can reach the
  # server. 198.18.0.0/15 is the RFC 2544 benchmarking block: never routed, not private space.
  vpn-sentinel:
    driver: bridge
    ipam:
      config:
        - subnet: ${VPN_SENTINEL_DOCKER_SUBNET:-198.18.0.0/24}
