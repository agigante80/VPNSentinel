# Override used ONLY by `bin/local-env verify-notify` (issue #143). Never reference it from a
# production compose file. Paths resolve relative to tests/.
services:
  notify-receiver:
    image: python:3.12-slim
    container_name: vpn-sentinel-notify-receiver
    init: true
    stop_grace_period: 2s
    command: ["python", "/app/notify_receiver.py"]
    volumes:
      - ./fixtures/notify_receiver.py:/app/notify_receiver.py:ro
    networks:
      - vpn-sentinel-test
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15

  vpn-sentinel-server-test:
    depends_on:
      notify-receiver:
        condition: service_healthy
    environment:
      - VPN_SENTINEL_APPRISE_URLS=json://notify-receiver:8099/hook json://notify-receiver:8099/hang
      - VPN_SENTINEL_CLIENT_TIMEOUT_MINUTES=1
